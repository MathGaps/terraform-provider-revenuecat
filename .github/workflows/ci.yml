name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: make fmtcheck

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -timeout 120s

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  # Reachability-based: govulncheck reports a vulnerability only when a call
  # path from this module reaches the affected symbol, so a CVE deep in a
  # dependency the provider never calls does not fail the build. Without it,
  # 0.1.19 nearly shipped on go 1.25.8 with 32 reachable vulnerabilities.
  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Pinned rather than @latest: a govulncheck release that raises its own
      # go directive past go.mod's fails to build under GOTOOLCHAIN=local.
      # Raise this together with go.mod.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  terraform-e2e:
    name: End-to-end against the mock API
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported line and the current one, so a change that only
        # works on one of them is caught here rather than by a practitioner.
        terraform: ["1.9.*", "1.14.*"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: Run the Terraform-driven end-to-end tests
        env:
          TF_ACC: "1"
        run: go test ./internal/provider/ -run TestE2E -v -timeout 30m

  compose-e2e:
    name: End-to-end in containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply the complete example against the mock in containers
        run: |
          docker compose up \
            --build \
            --abort-on-container-exit \
            --exit-code-from e2e

      - name: Show the mock server log on failure
        if: failure()
        run: docker compose logs mock

      - name: Tear down
        if: always()
        run: docker compose down -v
