version: 2

# The registry requires the release artifacts to be named
# terraform-provider-revenuecat_<version>_<os>_<arch>.zip. GoReleaser would
# otherwise infer the project name from the checkout directory, so pin it.
project_name: terraform-provider-revenuecat

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }}"
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  # A draft until every asset is up: the release workflow publishes it in its
  # last step. The OpenTofu registry scans for new releases every few minutes,
  # and a release it sees before SHA256SUMS has uploaded is recorded as an error
  # and not retried for half an hour (FORK.md).
  draft: true

# No changelog block: `--release-notes` in the release workflow supplies the
# body from CHANGELOG.md, and GoReleaser loads that file during the changelog
# step. `disable: true` here skips the step -- and with it the file, silently
# publishing an empty release body.
